<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
<title>延保表單產生器</title>
<style>
/* ===================== 基本 ===================== */
:root{
  --red:#C8161D; --red-d:#A61017; --gold:#B8934A; --gold-l:#D8C08A;
  --cream:#F7F0E0; --pinkf:#FDF1F1; --ink:#231F20; --ink-2:#4a4646;
  --panel:#ffffff; --page:#eceae5; --line:#dcd8d0; --accent:#C8161D;
  --ok:#1c7c4a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC","Hiragino Sans GB",sans-serif;
  font-size:14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}

.app{display:flex;align-items:flex-start;min-height:100vh}

/* ===================== 控制面板 ===================== */
.panel{width:330px;flex:0 0 330px;background:var(--panel);border-right:1px solid var(--line);
  padding:16px 16px 40px;position:sticky;top:0;max-height:100vh;overflow-y:auto}
.panel h1{font-size:16px;margin:0 0 2px;letter-spacing:.5px}
.panel h1 b{color:var(--red)}
.panel .src{font-size:11px;color:#8a8580;margin-bottom:14px;line-height:1.5}
.grp{border-top:1px solid var(--line);padding:12px 0 4px}
.grp:first-of-type{border-top:0}
.grp>label.t{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:7px;letter-spacing:.5px}
.hint{font-size:11px;color:#8a8580;line-height:1.55;margin:6px 0 0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-width:60px;padding:8px 6px;font:inherit;font-size:12.5px;font-weight:700;
  background:#f6f5f2;border:1px solid var(--line);border-radius:7px;cursor:pointer;color:var(--ink-2)}
.seg button:hover{background:#efeee9}
.seg button.on{background:var(--red);border-color:var(--red);color:#fff}
/* 分頁（暫存 8 組品項／延保金額） */
.tabs{display:flex;gap:3px;margin-bottom:7px}
.tabs button{flex:1 1 0;min-width:0;padding:5px 0 4px;font:inherit;font-size:12px;font-weight:700;line-height:1.15;
  background:#f4f3f0;border:1px solid var(--line);border-radius:5px 5px 0 0;cursor:pointer;color:#b0aaa4}
.tabs button:hover{background:#eceae5}
.tabs button i{display:block;height:2px;margin:2px 5px 0;border-radius:1px;background:transparent}
.tabs button.has{color:var(--ink-2);background:#fff}
.tabs button.has i{background:var(--red)}
.tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
.tabs button.on.has i{background:#FFD84D}
.lnk{border:0;background:none;padding:0;font:inherit;font-size:11px;color:var(--red);text-decoration:underline;cursor:pointer}
input[type=text],input[type=number],select,textarea{width:100%;padding:8px 9px;font:inherit;font-size:13px;
  border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(200,22,29,.25);border-color:var(--red)}
textarea{resize:vertical;line-height:1.5}
.row2{display:flex;gap:8px}
.row2>*{flex:1;min-width:0}
.feelist{display:flex;flex-direction:column;gap:6px}
.feerow{display:flex;align-items:center;gap:8px}
.feerow .pl{flex:0 0 58px;font-weight:900;font-size:14px;color:var(--red);font-family:"Arial Black",Arial,sans-serif}
.feerow .yr{flex:0 0 74px;font-size:10.5px;color:#8a8580;line-height:1.25}
.feerow input{flex:1;text-align:right;font-weight:700}
.feerow .sku{flex:0 0 54px;font-size:10px;color:#a09a94;text-align:right;font-variant-numeric:tabular-nums}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:9px 8px;font:inherit;font-size:12.5px;font-weight:700;border-radius:7px;cursor:pointer;
  border:1px solid var(--line);background:#f6f5f2;color:var(--ink-2)}
.btn:hover{background:#efeee9}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-d)}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);margin-top:7px;cursor:pointer}
.chk input{width:15px;height:15px;accent-color:var(--red);flex:0 0 auto}
.band{font-size:12px;margin-top:8px;padding:7px 9px;border-radius:7px;background:#f2f7f2;color:var(--ok);
  border:1px solid #cfe4d6;line-height:1.5}
.band.warn{background:#fdf3f3;color:var(--red);border-color:#f0cfd0}
.file{display:block;margin-top:6px;font-size:12px}
.legend{font-size:11px;color:#8a8580;line-height:1.6;margin-top:6px}

/* ===================== 預覽舞台 ===================== */
.stage{flex:1;min-width:0;padding:22px 22px 60px;display:flex;flex-direction:column;align-items:center;gap:14px}
.stagebar{width:100%;max-width:1000px;display:flex;justify-content:space-between;align-items:center;
  font-size:12px;color:#8a8580}
.stagebar b{color:var(--ink-2)}
.sheetwrap{transform-origin:top center}
.sheet{background:#fff;box-shadow:0 4px 22px rgba(0,0,0,.16);position:relative;overflow:hidden;
  display:flex;flex-wrap:wrap;align-content:flex-start}
.sheet.portrait{width:210mm;height:297mm}
.sheet.landscape{width:297mm;height:210mm}
.cell{position:relative;overflow:hidden}
.cell.marks{outline:.25mm dashed #c9c9c9;outline-offset:-.125mm}
.cell>.poster{position:absolute;top:0;left:0;transform-origin:top left}

/* ===================== 海報本體（基準 A5 148.5 x 210mm） ===================== */
.poster{width:148.5mm;height:210mm;background:#FBFAF7;color:var(--ink);
  padding:6.5mm 7mm 5mm;display:flex;flex-direction:column;font-size:4mm;line-height:1.2}
.p-head{display:flex;align-items:center;gap:2.5mm;flex:0 0 auto}
.p-brand{background:var(--red);color:#fff;font-weight:900;font-size:1.45em;letter-spacing:.06em;
  padding:.9mm 2.2mm 1.3mm;border-radius:.6mm}
.p-rule{flex:1;height:.7mm;background:var(--gold);border-radius:1mm}
.p-title{font-weight:900;color:var(--red);font-size:4.5em;line-height:1.07;letter-spacing:-.01em;
  margin:1.6mm 0 0}
.p-sub{font-weight:900;font-size:1.42em;line-height:1.3;color:var(--ink);margin:1.2mm 0 0;letter-spacing:.01em}
.p-sub.one{font-size:1.78em}
.p-rows{flex:1 1 auto;display:flex;flex-direction:column;gap:1.6mm;margin:2.4mm 0 0;min-height:0}
.p-row{flex:1 1 0;display:flex;align-items:stretch;border:.55mm solid var(--gold);border-radius:2mm;overflow:hidden;min-height:0}
.p-row.b{border-color:var(--red)}
.p-row .plan{flex:0 0 34%;background:var(--cream);border-right:.4mm solid var(--gold-l);
  display:flex;flex-direction:column;justify-content:center;padding:1mm 2mm 1.2mm}
.p-row.b .plan{background:var(--pinkf);border-right-color:#eabfc0}
.p-row .pnum{font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;font-weight:900;color:var(--red);
  font-size:3.15em;line-height:1;letter-spacing:-.02em}
.p-row .pdesc{font-weight:900;font-size:.94em;line-height:1.3;color:var(--ink);margin-top:.6mm;white-space:nowrap}
.p-row .fee{flex:1;display:flex;flex-direction:column;justify-content:center;padding:1mm 2.4mm 1.2mm 3mm;background:#fff;min-width:0}
.p-row .flab{font-weight:700;font-size:.98em;color:var(--ink);margin-bottom:.4mm}
.p-row .fline{display:flex;align-items:center;gap:1.6mm}
.p-row .nt{font-weight:900;font-size:1.7em;letter-spacing:.01em}
.p-row .fbox{flex:1;min-width:0;border:.7mm solid var(--red);border-radius:1.4mm;height:12.5mm;
  display:flex;align-items:center;justify-content:center;background:#fff;
  font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;font-weight:900;font-size:2.6em;color:var(--red);
  padding:0 1mm;overflow:hidden;white-space:nowrap}
.p-row .yuan{font-weight:900;font-size:1.7em}
.p-row .conv{font-size:.85em;font-weight:700;color:var(--red);margin-top:.8mm;text-align:right;white-space:nowrap}
.p-banner{flex:0 0 auto;display:flex;align-items:stretch;gap:0;margin-top:2mm;
  border-radius:1.8mm;overflow:hidden;background:var(--red)}
.p-banner .bl{color:#fff;font-weight:900;font-size:1.8em;padding:.6mm 3mm 1.2mm 2.5mm;display:flex;align-items:center;white-space:nowrap}
.p-banner .bl i{color:#FFD84D;font-style:normal}
.p-banner .br{flex:1;background:var(--red);display:flex;align-items:center;gap:1.6mm;padding:1.2mm 2.4mm 1.2mm 0}
.p-banner .br .nt{color:#fff;font-weight:900;font-size:1.5em}
.p-banner .br .bbox{flex:1;min-width:0;background:#fff;border-radius:1.2mm;height:10.6mm;display:flex;
  align-items:center;justify-content:center;font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:2.3em;color:var(--red)}
.p-banner .br .yuan{color:#fff;font-weight:900;font-size:1.5em}
.p-foot{flex:0 0 auto;margin-top:2.2mm;text-align:center}
.p-foot .divider{height:.4mm;background:var(--gold);margin:0 0 1.8mm;border-radius:1mm}
.p-foot .slogan{font-weight:900;font-size:1.85em;color:var(--red);letter-spacing:.02em;margin-bottom:1.2mm}
.p-foot .fine{font-weight:700;font-size:.84em;line-height:1.45;color:var(--ink)}

/* ===================== 列印 ===================== */
@media print{
  body{background:#fff}
  .panel,.stagebar{display:none !important}
  .app{display:block}
  .stage{padding:0;gap:0;display:block}
  .sheetwrap{transform:none !important;margin:0 !important}
  .sheet{box-shadow:none;break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
}
</style>

<div class="app">
  <aside class="panel">
    <h1><b>全國電子</b> 延長保固表單產生器</h1>
    <div class="src">價目來源：<span id="srcName">內建（官網公告版）</span><br><span id="srcCount"></span></div>

    <div class="grp">
      <label class="t">1. 商品類別方案</label>
      <div class="seg" id="catSeg"></div>
      <div class="hint" id="catSub"></div>
    </div>

    <div class="grp">
      <label class="t">2. 商品金額（不輸入 → 空白表單）</label>
      <div class="tabs" id="tabSeg"></div>
      <div class="row2">
        <input type="number" id="amount" placeholder="例：25800" min="0" step="1">
        <button class="btn" id="btnClear" style="flex:0 0 96px">清空金額</button>
      </div>
      <div class="band" id="bandInfo">未輸入金額，將產出空白表單供手寫。</div>
      <div class="legend"><span id="tabInfo"></span>　<button class="lnk" id="btnClearAll">清空全部分頁</button></div>
    </div>

    <div class="grp">
      <label class="t">3. 延保費用（可手動調整）</label>
      <div class="feelist" id="feeList"></div>
      <div class="legend">右側灰色數字為延保料號（僅螢幕顯示，不會列印）。</div>
    </div>

    <div class="grp">
      <label class="t">4. 每日／每月換算</label>
      <div class="seg" id="convSeg">
        <button data-v="none">不顯示</button>
        <button data-v="banner">紅底橫幅</button>
        <button data-v="inline">逐列註記</button>
      </div>
      <div class="row2" style="margin-top:8px">
        <select id="convUnit">
          <option value="month">每月</option>
          <option value="day">每日</option>
          <option value="both">每月＋每日</option>
        </select>
        <select id="convPlan"></select>
      </div>
      <div class="row2" style="margin-top:8px">
        <select id="convBasis">
          <option value="ext">÷ 延長年數</option>
          <option value="total">÷ 總保固年數</option>
        </select>
        <input type="text" id="convManual" placeholder="橫幅數字（可覆寫）">
      </div>
      <div class="hint" id="convHint"></div>
    </div>

    <div class="grp">
      <label class="t">5. 列印版面</label>
      <div class="seg" id="layoutSeg">
        <button data-v="full">完整 A4<br><small style="font-weight:400">1 份</small></button>
        <button data-v="duo">A4 雙拼<br><small style="font-weight:400">2 份</small></button>
        <button data-v="quad">A4 四拼<br><small style="font-weight:400">4 份</small></button>
        <button data-v="octo">A4 八拼<br><small style="font-weight:400">8 份</small></button>
      </div>
      <label class="chk"><input type="checkbox" id="optMarks" checked>顯示裁切虛線</label>
      <label class="t" style="margin:10px 0 7px">拼版排列方式</label>
      <div class="seg" id="fillSeg">
        <button data-v="same">重複目前分頁</button>
        <button data-v="tabs">依分頁順序</button>
        <button data-v="cats">三類別輪流</button>
      </div>
      <div class="legend" id="fillHint"></div>
      <div class="btnrow">
        <button class="btn primary" id="btnPrint">列印 / 另存 PDF</button>
        <button class="btn primary" id="btnWord" style="background:#1f5fa8;border-color:#1f5fa8">另存 WORD</button>
      </div>
      <div class="legend" id="layoutHint"></div>
      <div class="legend">WORD 檔（.docx）版面與目前預覽相同，人員可直接在 Word 內點價格框修改數字後列印；列印時邊界請維持 0、縮放 100%。</div>
    </div>

    <div class="grp">
      <label class="t">6. 頁尾說明文字</label>
      <textarea id="footNote" rows="2"></textarea>
      <label class="chk"><input type="checkbox" id="optSlogan" checked>顯示「延長安心，使用更放心」</label>
    </div>

    <div class="grp">
      <label class="t">7. 價格表維護（CSV）</label>
      <input class="file" type="file" id="csvFile" accept=".csv,text/csv">
      <div class="btnrow">
        <button class="btn" id="btnExport">匯出目前 CSV</button>
        <button class="btn" id="btnReset">還原內建</button>
      </div>
      <div class="legend">欄位：類別代碼／類別名稱／類別副標／方案代碼／原廠年／延長年／價格帶下限／價格帶上限／價格帶顯示／延保費用／料號。改價、加價格帶、新增類別（例：冷氣）都只需編輯此 CSV 後重新載入。副標換行請填 \n。</div>
    </div>
  </aside>

  <main class="stage">
    <div class="stagebar">
      <div id="stageInfo"></div>
      <div>預覽比例 <b id="zoomInfo"></b></div>
    </div>
    <div class="sheetwrap" id="sheetWrap"></div>
  </main>
</div>

<script>
/* ============================================================
   全國電子 延長保固表單產生器
   ============================================================ */
const DEFAULT_DB = [{"cid":"TV","name":"電視","sub":"多享更長久的保障","plans":["2+2","2+3","3+2"],"bands":[{"band":"10,000以下","lo":0,"hi":10000,"fees":[1300,2050,1430],"skus":["2160594","2160593","2160592"]},{"band":"10,001-15,000","lo":10001,"hi":15000,"fees":[1350,2300,1500],"skus":["2160591","2160590","2160589"]},{"band":"15,001-20,000","lo":15001,"hi":20000,"fees":[1450,2400,1630],"skus":["2159542","2159533","2159524"]},{"band":"20,001-25,000","lo":20001,"hi":25000,"fees":[1600,2650,1780],"skus":["2159541","2159532","2159523"]},{"band":"25,001-30,000","lo":25001,"hi":30000,"fees":[2200,3550,2420],"skus":["2159540","2159531","2159522"]},{"band":"30,001-40,000","lo":30001,"hi":40000,"fees":[2750,4700,2910],"skus":["2159539","2159530","2159521"]},{"band":"40,001-50,000","lo":40001,"hi":50000,"fees":[4100,6970,4310],"skus":["2159538","2159529","2159520"]},{"band":"50,001-70,000","lo":50001,"hi":70000,"fees":[5650,9940,6150],"skus":["2159537","2159528","2159519"]},{"band":"70,001-100,000","lo":70001,"hi":100000,"fees":[8000,13600,8380],"skus":["2159536","2159527","2159518"]},{"band":"100,001-150,000","lo":100001,"hi":150000,"fees":[10000,17050,10530],"skus":["2159535","2159526","2159517"]},{"band":"150,001-200,000","lo":150001,"hi":200000,"fees":[12800,21850,13430],"skus":["2159534","2159525","2159516"]}]},{"cid":"SA_A","name":"小家電A","sub":"適用：電子鍋、烤箱、微波爐、果汁機\n咖啡機、淨水器、吸塵器、吹風機","plans":["1+2","1+3","2+1"],"bands":[{"band":"3,000以下","lo":0,"hi":3000,"fees":[270,400,200],"skus":["2160587","2160586","2160585"]},{"band":"3,001-6,000","lo":3001,"hi":6000,"fees":[360,540,250],"skus":["2160584","2160583","2160582"]},{"band":"6,001-10,000","lo":6001,"hi":10000,"fees":[480,700,370],"skus":["2160581","2160580","2160579"]},{"band":"10,001-15,000","lo":10001,"hi":15000,"fees":[680,1020,480],"skus":["2159506","2159500","2159494"]},{"band":"15,001-20,000","lo":15001,"hi":20000,"fees":[910,1370,640],"skus":["2159505","2159499","2159493"]},{"band":"20,001-25,000","lo":20001,"hi":25000,"fees":[1090,1630,760],"skus":["2159504","2159498","2159492"]},{"band":"25,001-30,000","lo":25001,"hi":30000,"fees":[1270,1910,890],"skus":["2159503","2159497","2159491"]},{"band":"30,001-40,000","lo":30001,"hi":40000,"fees":[1780,2660,1240],"skus":["2159502","2159496","2159490"]},{"band":"40,001-50,000","lo":40001,"hi":50000,"fees":[2280,3420,1600],"skus":["2159501","2159495","2159489"]}]},{"cid":"SA_B","name":"小家電B","sub":"適用：除濕機、清淨機","plans":["1+2","1+3","2+1","3+2"],"bands":[{"band":"3,000以下","lo":0,"hi":3000,"fees":[330,490,250,460],"skus":["2160705","2160695","2160685","2160675"]},{"band":"3,001-6,000","lo":3001,"hi":6000,"fees":[400,600,300,580],"skus":["2160704","2160694","2160684","2160674"]},{"band":"6,001-10,000","lo":6001,"hi":10000,"fees":[600,850,410,800],"skus":["2160703","2160693","2160683","2160673"]},{"band":"10,001-15,000","lo":10001,"hi":15000,"fees":[800,1100,520,1100],"skus":["2160702","2160692","2160682","2160672"]},{"band":"15,001-20,000","lo":15001,"hi":20000,"fees":[1100,1560,750,1480],"skus":["2160701","2160691","2160681","2160671"]},{"band":"20,001-25,000","lo":20001,"hi":25000,"fees":[1380,1920,900,1800],"skus":["2160700","2160690","2160680","2160670"]},{"band":"25,001-30,000","lo":25001,"hi":30000,"fees":[1600,2380,1110,2220],"skus":["2160699","2160689","2160679","2160669"]},{"band":"30,001-40,000","lo":30001,"hi":40000,"fees":[2300,3450,1610,3220],"skus":["2160698","2160688","2160678","2160668"]},{"band":"40,001-50,000","lo":40001,"hi":50000,"fees":[3100,4520,2110,4220],"skus":["2160697","2160687","2160677","2160667"]},{"band":"50,001-60,000","lo":50001,"hi":60000,"fees":[3700,5530,2580,5160],"skus":["2160696","2160686","2160676","2160666"]}]}];
const DEFAULT_SRC = "內建（官網公告版）";
const DEFAULT_FOOT = "適用方案依商品原廠保固年限而定。\n詳細保障內容與適用條件，請洽門市人員。";

let DB = JSON.parse(JSON.stringify(DEFAULT_DB));
let SRC = DEFAULT_SRC;

const LAYOUTS = {
  full: {page:"portrait", cols:1, rows:1, cw:210,   ch:297,   scale:210/148.5, label:"完整 A4 一份"},
  duo:  {page:"landscape",cols:2, rows:1, cw:148.5, ch:210,   scale:1,         label:"A4 橫向雙拼（A5 × 2）"},
  quad: {page:"portrait", cols:2, rows:2, cw:105,   ch:148.5, scale:105/148.5, label:"A4 四拼（A6 × 4）"},
  octo: {page:"landscape",cols:4, rows:2, cw:74.25, ch:105,   scale:.5,        label:"A4 橫向八拼（A7 × 8）"}
};

/* 分頁：8 組暫存，各自記住品項（類別）、商品金額與延保費用 */
const SLOTS = 8;
const newSlot = () => ({cid: DB[0].cid, amount: "", fees: {}, plan: "", manual: ""});

const state = {
  tab: 0,                                            // 目前編輯中的分頁
  slots: Array.from({length: SLOTS}, newSlot),       // fees[cid][plan] = string
  conv: {mode:"none", unit:"month", basis:"ext"},    // 換算的顯示方式（全部分頁共用）
  layout: "full",
  marks: true,
  fill: "same",                                      // same=重複目前分頁／tabs=依分頁順序／cats=三類別輪流
  foot: DEFAULT_FOOT,
  slogan: true
};

/* ---------- 工具 ---------- */
const $  = s => document.querySelector(s);
const cat = cid => DB.find(c => c.cid === cid) || DB[0];
const nf  = n => Number(n).toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
const yrs = plan => {const p = String(plan).split("+"); return {base:+p[0]||0, ext:+p[1]||0};};
const cur = () => state.slots[state.tab];

function initFees(){
  state.slots.forEach(s => {
    if(!DB.find(c => c.cid === s.cid)) s.cid = DB[0].cid;
    DB.forEach(c => {
      s.fees[c.cid] = s.fees[c.cid] || {};
      c.plans.forEach(p => { if(s.fees[c.cid][p] === undefined) s.fees[c.cid][p] = ""; });
    });
    if(!cat(s.cid).plans.includes(s.plan)) s.plan = cat(s.cid).plans[0];
  });
}
/* 分頁是否已填寫（有商品金額或任一延保費用） */
function slotUsed(s){
  const f = s.fees[s.cid] || {};
  return s.amount !== "" || cat(s.cid).plans.some(p => String(f[p] ?? "") !== "");
}
const usedSlots = () => { const u = state.slots.filter(slotUsed); return u.length ? u : [cur()]; };
function slotTitle(s, i){
  return "分頁 " + (i + 1) + "：" + (slotUsed(s)
    ? cat(s.cid).name + (s.amount !== "" ? "　商品 $" + nf(s.amount) : "　手動填價")
    : "（空白）");
}
function bandOf(c, amt){
  if(amt === "" || amt === null || isNaN(amt)) return null;
  const a = Number(amt);
  return c.bands.find(b => a >= b.lo && a <= b.hi) || null;
}
function skuOf(c, plan, amt){
  const b = bandOf(c, amt); if(!b) return "";
  const i = c.plans.indexOf(plan);
  return (b.skus && b.skus[i]) || "";
}

/* ---------- 換算 ---------- */
function convValues(plan, fee){
  const f = Number(String(fee).replace(/[^\d.]/g,""));
  if(!f) return null;
  const y = yrs(plan);
  const years = state.conv.basis === "total" ? (y.base + y.ext) : y.ext;
  if(!years) return null;
  const perMonth = f / (years * 12);
  const perDay   = f / (years * 365);
  const r = v => v < 10 ? (Math.round(v*10)/10).toFixed(1) : nf(Math.round(v));
  return {month:r(perMonth), day:r(perDay), years:years};
}
function convText(plan, fee){
  const v = convValues(plan, fee); if(!v) return "";
  const u = state.conv.unit;
  if(u === "month") return "約每月 $" + v.month;
  if(u === "day")   return "約每天 $" + v.day;
  return "約每月 $" + v.month + "／每天 $" + v.day;
}

/* ---------- 海報 ---------- */
function posterHTML(sl){
  const c = cat(sl.cid);
  const fees = sl.fees[sl.cid] || {};
  const rowsHTML = c.plans.map((plan, i) => {
    const y = yrs(plan);
    const fee = fees[plan];
    const feeTxt = (fee === "" || fee === undefined) ? "" : nf(Number(String(fee).replace(/[^\d.]/g,""))||fee);
    const conv = state.conv.mode === "inline" ? convText(plan, fee) : "";
    return '<div class="p-row ' + (i % 2 ? "b" : "a") + '">' +
      '<div class="plan"><div class="pnum">' + esc(plan) + '</div>' +
      '<div class="pdesc">原廠' + y.base + '年<br>＋延長' + y.ext + '年</div></div>' +
      '<div class="fee"><div class="flab">延保費用</div>' +
      '<div class="fline"><span class="nt">NT$</span><div class="fbox">' + esc(feeTxt) + '</div><span class="yuan">元</span></div>' +
      (conv ? '<div class="conv">' + esc(conv) + '</div>' : '') +
      '</div></div>';
  }).join("");

  let banner = "";
  if(state.conv.mode === "banner"){
    const plan = c.plans.includes(sl.plan) ? sl.plan : c.plans[0];
    const unit = state.conv.unit === "day" ? "day" : "month";
    const v = convValues(plan, fees[plan]);
    const shown = sl.manual !== "" ? sl.manual : (v ? v[unit] : "");
    const word = unit === "day" ? "每天" : "每月";
    banner = '<div class="p-banner"><div class="bl">' + word + '<i>只要</i></div>' +
      '<div class="br"><span class="nt">NT$</span><div class="bbox">' + esc(shown) + '</div><span class="yuan">元</span></div></div>';
  }

  const title = esc(c.name) + '<br>延長保固方案';
  const sub   = esc(c.sub || "").replace(/\\n|\n/g, "<br>");
  const fine  = esc(state.foot).replace(/\n/g, "<br>");
  const showSlogan = state.slogan && state.conv.mode !== "banner";

  return '<div class="poster">' +
    '<div class="p-head"><div class="p-brand">全國電子</div><div class="p-rule"></div></div>' +
    '<div class="p-title">' + title + '</div>' +
    (sub ? '<div class="p-sub' + (sub.indexOf("<br>") < 0 ? " one" : "") + '">' + sub + '</div>' : '') +
    '<div class="p-rows">' + rowsHTML + '</div>' +
    banner +
    '<div class="p-foot">' +
      (showSlogan ? '<div class="divider"></div><div class="slogan">延長安心，使用更放心</div>'
                  : (state.conv.mode === "banner" ? '' : '<div class="divider"></div>')) +
    '<div class="fine">' + fine + '</div></div>' +
  '</div>';
}

/* ---------- 版面 ---------- */
function sheetOrder(){
  const L = LAYOUTS[state.layout];
  const n = L.cols * L.rows;
  const order = [];
  if(state.fill === "tabs"){
    const u = usedSlots();                       // 只取有填寫的分頁，不足時循環重複
    for(let i = 0; i < n; i++) order.push(u[i % u.length]);
  } else if(state.fill === "cats"){
    const s = cur();
    for(let i = 0; i < n; i++){
      const cid = DB[i % DB.length].cid;
      order.push(Object.assign({}, s, {cid: cid, plan: cat(cid).plans.includes(s.plan) ? s.plan : cat(cid).plans[0]}));
    }
  } else {
    for(let i = 0; i < n; i++) order.push(cur());
  }
  return order;
}
function orderLabel(order){
  return order.map(sl => {
    const i = state.slots.indexOf(sl);
    return i >= 0 ? "分頁" + (i + 1) : cat(sl.cid).name;
  }).join("→");
}
function renderSheet(){
  const L = LAYOUTS[state.layout];
  const order = sheetOrder();
  const cells = order.map(sl =>
    '<div class="cell' + (state.marks ? " marks" : "") + '" style="width:' + L.cw + 'mm;height:' + L.ch + 'mm">' +
      '<div style="position:absolute;top:0;left:0;transform:scale(' + L.scale + ');transform-origin:top left">' +
        posterHTML(sl) +
      '</div></div>').join("");

  $("#sheetWrap").innerHTML = '<div class="sheet ' + L.page + '">' + cells + '</div>';
  setPageRule(L.page);
  fitPreview();
  save();
  $("#stageInfo").innerHTML = "<b>" + L.label + "</b>　每份成品尺寸 " + L.cw + " × " + L.ch + " mm" +
    (order.length > 1 && state.fill !== "same" ? "　排列 " + esc(orderLabel(order)) : "");
  $("#layoutHint").textContent = "列印設定請選 A4、" + (L.page === "landscape" ? "橫向" : "直向") + "、邊界「無」、縮放 100%。";
}
let pageStyle;
function setPageRule(o){
  if(!pageStyle){ pageStyle = document.createElement("style"); document.head.appendChild(pageStyle); }
  pageStyle.textContent = "@page{size:A4 " + o + ";margin:0}";
}
function fitPreview(){
  const L = LAYOUTS[state.layout];
  const wmm = L.page === "landscape" ? 297 : 210;
  const hmm = L.page === "landscape" ? 210 : 297;
  const px = wmm * 96 / 25.4;
  const avail = Math.max(320, $(".stage").clientWidth - 44);
  const k = Math.min(1, avail / px);
  const wrap = $("#sheetWrap");
  wrap.style.transform = "scale(" + k + ")";
  wrap.style.height = (hmm * 96 / 25.4 * k) + "px";
  $("#zoomInfo").textContent = Math.round(k * 100) + "%";
}
window.addEventListener("resize", fitPreview);

/* ---------- 控制面板 ---------- */
function renderPanel(){
  const s = cur(), c = cat(s.cid);

  // 分頁
  $("#tabSeg").innerHTML = state.slots.map((x, i) =>
    '<button data-i="' + i + '" class="' + (i === state.tab ? "on " : "") + (slotUsed(x) ? "has" : "") +
    '" title="' + esc(slotTitle(x, i)) + '">' + (i + 1) + '<i></i></button>').join("");
  $("#tabSeg").querySelectorAll("button").forEach(b => b.onclick = () => {
    state.tab = +b.dataset.i;
    applyAmount(false); renderPanel(); renderSheet();
  });
  const used = state.slots.map((x, i) => slotUsed(x)
    ? (i + 1) + " " + cat(x.cid).name + (x.amount !== "" ? " $" + nf(x.amount) : "") : null).filter(Boolean);
  $("#tabInfo").textContent = used.length ? "已存：" + used.join("｜") : "8 個分頁皆空白，可分別存入不同品項與價位。";
  if($("#amount").value !== s.amount) $("#amount").value = s.amount;

  $("#catSeg").innerHTML = DB.map(x =>
    '<button data-cid="' + esc(x.cid) + '" class="' + (x.cid === s.cid ? "on" : "") + '">' + esc(x.name) + '</button>').join("");
  $("#catSeg").querySelectorAll("button").forEach(b => b.onclick = () => {
    s.cid = b.dataset.cid;
    s.plan = cat(s.cid).plans[0];
    s.manual = "";
    applyAmount(true); renderPanel(); renderSheet();
  });
  $("#catSub").innerHTML = esc(c.sub || "").replace(/\\n|\n/g, "　");

  // 費用列
  const fees = s.fees[s.cid] || {};
  $("#feeList").innerHTML = c.plans.map(p => {
    const y = yrs(p);
    const sku = skuOf(c, p, s.amount);
    return '<div class="feerow"><span class="pl">' + esc(p) + '</span>' +
      '<span class="yr">原廠' + y.base + '年<br>＋延長' + y.ext + '年</span>' +
      '<input type="text" data-plan="' + esc(p) + '" value="' + esc(fees[p] ?? "") + '" placeholder="空白">' +
      '<span class="sku">' + esc(sku) + '</span></div>';
  }).join("");
  $("#feeList").querySelectorAll("input").forEach(inp => inp.oninput = () => {
    s.fees[s.cid][inp.dataset.plan] = inp.value.replace(/[^\d]/g, "");
    if(inp.value !== s.fees[s.cid][inp.dataset.plan]) inp.value = s.fees[s.cid][inp.dataset.plan];
    renderSheet(); updateConvHint();
  });

  // 換算
  $("#convSeg").querySelectorAll("button").forEach(b => {
    b.classList.toggle("on", b.dataset.v === state.conv.mode);
    b.onclick = () => { state.conv.mode = b.dataset.v; renderPanel(); renderSheet(); };
  });
  if(!c.plans.includes(s.plan)) s.plan = c.plans[0];
  $("#convPlan").innerHTML = c.plans.map(p =>
    '<option value="' + esc(p) + '"' + (p === s.plan ? " selected" : "") + '>' + esc(p) + ' 方案</option>').join("");
  $("#convUnit").value  = state.conv.unit;
  $("#convBasis").value = state.conv.basis;
  $("#convManual").value = s.manual;
  $("#convPlan").disabled = state.conv.mode !== "banner";
  $("#convManual").disabled = state.conv.mode !== "banner";
  updateConvHint();

  // 版面
  $("#layoutSeg").querySelectorAll("button").forEach(b => {
    b.classList.toggle("on", b.dataset.v === state.layout);
    b.onclick = () => { state.layout = b.dataset.v; renderPanel(); renderSheet(); };
  });
  $("#fillSeg").querySelectorAll("button").forEach(b => {
    b.classList.toggle("on", b.dataset.v === state.fill);
    b.onclick = () => { state.fill = b.dataset.v; renderPanel(); renderSheet(); };
  });
  $("#fillHint").textContent =
    state.fill === "tabs" ? "依分頁 1→8 順序排入每一格，只取有填寫的分頁（目前 " + Math.max(1, used.length) +
                            " 個），份數較多時循環重複。"
  : state.fill === "cats" ? "三個類別輪流排，價格取目前分頁（分頁 " + (state.tab + 1) + "）各類別已填的費用。"
  :                         "每一格都印目前分頁（分頁 " + (state.tab + 1) + "）的內容。";
  $("#optMarks").checked  = state.marks;
  $("#optSlogan").checked = state.slogan;
  $("#footNote").value    = state.foot;
  $("#srcName").textContent  = SRC;
  $("#srcCount").textContent = DB.length + " 個類別／" +
    DB.reduce((s,x) => s + x.bands.length * x.plans.length, 0) + " 筆價格組合";
}
function updateConvHint(){
  const s = cur(), c = cat(s.cid);
  if(state.conv.mode === "none"){ $("#convHint").textContent = "表單不顯示換算金額。"; return; }
  const plan = state.conv.mode === "banner" ? (s.plan || c.plans[0]) : null;
  const basis = state.conv.basis === "total" ? "總保固年數" : "延長年數";
  if(plan){
    const v = convValues(plan, (s.fees[s.cid] || {})[plan]);
    $("#convHint").textContent = v
      ? plan + " 方案 ÷ " + basis + " " + v.years + " 年 → 每月 $" + v.month + "、每天 $" + v.day
      : "請先輸入商品金額或該方案費用，換算才會出現數字。";
  } else {
    $("#convHint").textContent = "每個方案各自以 " + basis + " 換算，顯示在費用框下方。";
  }
}

/* ---------- 金額 → 自動代入 ---------- */
/* write=true 時才把價格帶費用寫回分頁；切換分頁時只更新提示，保留手動改過的價格 */
function applyAmount(write){
  const s = cur(), c = cat(s.cid), raw = s.amount, tab = "分頁 " + (state.tab + 1) + "：";
  const info = $("#bandInfo");
  if(raw === ""){
    info.className = "band"; info.textContent = tab + "未輸入金額，將產出空白表單供手寫。";
    return;
  }
  const b = bandOf(c, raw);
  if(!b){
    info.className = "band warn";
    const last = c.bands[c.bands.length - 1];
    info.textContent = tab + "金額 " + nf(raw) + " 元不在 " + c.name + " 價格帶內（上限 " + nf(last.hi) + " 元），請確認或手動填入。";
    return;
  }
  if(write){
    c.plans.forEach((p, i) => { s.fees[c.cid][p] = String(b.fees[i]); });
    s.manual = "";
  }
  info.className = "band";
  info.textContent = tab + c.name + " " + b.band + "　→ " + c.plans.map((p, i) => p + " $" + nf(b.fees[i])).join("　");
}
/* 換價格表後，把每個有金額的分頁重新對一次價格帶 */
function reapplyAll(){
  state.slots.forEach(s => {
    const c = cat(s.cid), b = bandOf(c, s.amount);
    if(b) c.plans.forEach((p, i) => { s.fees[c.cid][p] = String(b.fees[i]); });
  });
}

/* ---------- CSV ---------- */
function parseCSV(text){
  text = text.replace(/^﻿/, "");
  const rows = []; let row = [], f = "", q = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){
      if(ch === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else f += ch;
    } else {
      if(ch === '"') q = true;
      else if(ch === ","){ row.push(f); f = ""; }
      else if(ch === "\n"){ row.push(f); rows.push(row); row = []; f = ""; }
      else if(ch === "\r"){ /* skip */ }
      else f += ch;
    }
  }
  if(f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim() !== ""));
}
const COLS = ["類別代碼","類別名稱","類別副標","方案代碼","原廠年","延長年","價格帶下限","價格帶上限","價格帶顯示","延保費用","料號"];
function dbFromCSV(text){
  const rows = parseCSV(text);
  if(!rows.length) throw new Error("CSV 沒有內容");
  const head = rows[0].map(h => String(h).trim());
  const idx = {}; COLS.forEach(k => idx[k] = head.indexOf(k));
  ["類別代碼","方案代碼","價格帶下限","價格帶上限","延保費用"].forEach(k => {
    if(idx[k] < 0) throw new Error("CSV 缺少必要欄位：" + k);
  });
  const out = [];
  for(let i = 1; i < rows.length; i++){
    const r = rows[i], g = k => idx[k] >= 0 ? String(r[idx[k]] ?? "").trim() : "";
    const cid = g("類別代碼"); if(!cid) continue;
    let c = out.find(x => x.cid === cid);
    if(!c){ c = {cid:cid, name:g("類別名稱") || cid, sub:g("類別副標"), plans:[], bands:[]}; out.push(c); }
    if(g("類別副標") && !c.sub) c.sub = g("類別副標");
    const plan = g("方案代碼"); if(!plan) continue;
    if(!c.plans.includes(plan)) c.plans.push(plan);
    const lo = Number(g("價格帶下限")), hi = Number(g("價格帶上限"));
    const label = g("價格帶顯示") || (nf(lo) + "-" + nf(hi));
    let b = c.bands.find(x => x.lo === lo && x.hi === hi);
    if(!b){ b = {band:label, lo:lo, hi:hi, fees:[], skus:[]}; c.bands.push(b); }
    const pi = c.plans.indexOf(plan);
    b.fees[pi] = Number(String(g("延保費用")).replace(/[^\d.]/g, "")) || 0;
    b.skus[pi] = g("料號");
  }
  if(!out.length) throw new Error("CSV 沒有可用資料列");
  out.forEach(c => { c.bands.sort((a, b) => a.lo - b.lo);
    c.bands.forEach(b => { for(let i = 0; i < c.plans.length; i++){ b.fees[i] = b.fees[i] || 0; b.skus[i] = b.skus[i] || ""; } }); });
  return out;
}
function dbToCSV(){
  const q = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
  const lines = [COLS.join(",")];
  DB.forEach(c => c.plans.forEach((p, pi) => {
    const y = yrs(p);
    c.bands.forEach(b => lines.push([c.cid, c.name, String(c.sub || "").replace(/\n/g, "\\n"),
      p, y.base, y.ext, b.lo, b.hi, b.band, b.fees[pi], b.skus[pi] || ""].map(q).join(",")));
  }));
  return "﻿" + lines.join("\r\n");
}
function loadDB(newDB, srcLabel){
  DB = newDB; SRC = srcLabel;
  state.slots.forEach(s => { s.fees = {}; });
  initFees(); reapplyAll();
  applyAmount(false); renderPanel(); renderSheet();
}

/* ---------- 下載 ---------- */
function download(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

/* ============================================================
   Word (.docx) 匯出 —— 不依賴外部套件，直接組 WordprocessingML + ZIP
   版面與螢幕預覽相同：外層表格 = 拼版格，每格內以巢狀表格排海報。
   所有尺寸以「基準 A5 mm × 版面縮放 s」換算為 twip（1mm = 56.6929 twip）。
   ============================================================ */
const W_NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
const xesc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function wRun(text, o){
  o = o || {};
  // 每個 run 都明確指定字型（Word 不會可靠地套用 docDefaults 的東亞字型）
  const lat = o.font || "Arial";
  let rp = '<w:rFonts w:ascii="' + lat + '" w:hAnsi="' + lat + '" w:cs="' + lat + '" w:eastAsia="Microsoft JhengHei"/>';
  if(o.b !== false) rp += '<w:b/><w:bCs/>';
  if(o.color) rp += '<w:color w:val="' + o.color + '"/>';
  if(o.sz) rp += '<w:sz w:val="' + o.sz + '"/><w:szCs w:val="' + o.sz + '"/>';
  const t = String(text).split("\n").map(x => '<w:t xml:space="preserve">' + xesc(x) + '</w:t>').join('<w:br/>');
  return '<w:r><w:rPr>' + rp + '</w:rPr>' + t + '</w:r>';
}
function wP(runs, o){
  o = o || {};
  let pp = "";
  if(o.bdrB) pp += '<w:pBdr><w:bottom w:val="single" w:sz="' + o.bdrB.sz + '" w:space="0" w:color="' + o.bdrB.color + '"/></w:pBdr>';
  pp += '<w:autoSpaceDE w:val="0"/><w:autoSpaceDN w:val="0"/><w:snapToGrid w:val="0"/>';   // 不在中英文間自動加空格
  pp += '<w:spacing w:before="' + (o.before || 0) + '" w:after="' + (o.after || 0) + '"' +
        (o.line ? ' w:line="' + o.line + '" w:lineRule="exact"' : ' w:line="240" w:lineRule="auto"') + '/>';
  if(o.align) pp += '<w:jc w:val="' + o.align + '"/>';
  if(o.sz) pp += '<w:rPr><w:sz w:val="' + o.sz + '"/><w:szCs w:val="' + o.sz + '"/></w:rPr>';
  return '<w:p><w:pPr>' + pp + '</w:pPr>' + (runs || "") + '</w:p>';
}
const wSpacer = h => wP("", {line: Math.max(h, 10), sz: 2});
function wBorder(tag, b){
  return b ? '<w:' + tag + ' w:val="' + (b.val || "single") + '" w:sz="' + b.sz + '" w:space="0" w:color="' + b.color + '"/>'
           : '<w:' + tag + ' w:val="nil"/>';
}
function wBorders(tag, b){
  const sides = tag === "tblBorders" ? ["top","left","bottom","right","insideH","insideV"] : ["top","left","bottom","right"];
  return '<w:' + tag + '>' + sides.map(k => wBorder(k, b && b[k])).join("") + '</w:' + tag + '>';
}
function wTc(content, o){
  o = o || {};
  // 只有明確指定時才輸出儲存格邊框；否則會以「無邊框」蓋掉表格層級的邊框
  let tp = '<w:tcW w:w="' + o.w + '" w:type="dxa"/>' + (o.bdr ? wBorders("tcBorders", o.bdr) : "");
  if(o.shd) tp += '<w:shd w:val="clear" w:color="auto" w:fill="' + o.shd + '"/>';
  if(o.mar) tp += '<w:tcMar>' + ["top","left","bottom","right"].map(k => '<w:' + k + ' w:w="' + (o.mar[k] || 0) + '" w:type="dxa"/>').join("") + '</w:tcMar>';
  tp += '<w:vAlign w:val="' + (o.vAlign || "top") + '"/>';
  return '<w:tc><w:tcPr>' + tp + '</w:tcPr>' + content + '</w:tc>';
}
function wTbl(cols, rows, o){
  o = o || {};
  const w = cols.reduce((a, b) => a + b, 0);
  const tp = '<w:tblW w:w="' + w + '" w:type="dxa"/><w:tblInd w:w="0" w:type="dxa"/>' +
    wBorders("tblBorders", o.bdr || {}) + '<w:tblLayout w:type="fixed"/>' +
    '<w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="0" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="0" w:type="dxa"/></w:tblCellMar>';
  const grid = '<w:tblGrid>' + cols.map(c => '<w:gridCol w:w="' + c + '"/>').join("") + '</w:tblGrid>';
  // Word 的 exact 列高不含儲存格下邊距（實際列高 = 設定值 + 下邊距），故以 r.mb 扣回
  const trs = rows.map(r => '<w:tr><w:trPr><w:trHeight w:val="' + Math.max(20, r.h - (r.mb || 0)) + '" w:hRule="exact"/></w:trPr>' + r.cells.join("") + '</w:tr>').join("");
  return '<w:tbl><w:tblPr>' + tp + '</w:tblPr>' + grid + trs + '</w:tbl>';
}

/* 單張海報（放在一個拼版格內）；s = 版面縮放 */
function posterDocx(sl, s){
  const T = mm => Math.round(mm * s * 56.6929);                 // mm → twip
  const S = em => Math.max(2, Math.round(em * s * 22.677));     // em(基準 4mm) → 半點
  const B = mm => Math.min(96, Math.max(2, Math.round(mm * s * 22.677))); // 邊框 mm → 1/8 pt
  const RED = "C8161D", GOLD = "B8934A", GOLDL = "D8C08A", CREAM = "F7F0E0", PINK = "FDF1F1",
        INK = "231F20", WHITE = "FFFFFF", YEL = "FFD84D", AB = "Arial Black";
  const c = cat(sl.cid), fees = sl.fees[sl.cid] || {};
  const W = 148.5 - 14;                                          // 海報內容寬（基準 mm）
  const subTxt = String(c.sub || "").replace(/\\n/g, "\n");
  const subLines = subTxt ? subTxt.split("\n").length : 0;
  const subEm = subLines === 1 ? 1.78 : 1.42;
  const bannerOn = state.conv.mode === "banner";
  const showSlogan = state.slogan && !bannerOn;
  const showDivider = showSlogan || !bannerOn;
  const fineLines = state.foot.split("\n").length;
  const n = c.plans.length;

  // 高度預算（基準 mm），與 CSS 的 flex 配置對應，讓方案列平均分配剩餘高度
  const headH = 9.2, titleH = 1.6 + 2 * 4.5 * 4 * 1.2;
  const subH = subLines ? 1.2 + subLines * subEm * 4 * 1.3 : 0;
  const bannerH = bannerOn ? 2 + 13 : 0;
  const footH = 2.2 + (showDivider ? 3 : 0) + (showSlogan ? 1.85 * 4 * 1.3 + 1.2 : 0) + fineLines * .84 * 4 * 1.45;
  // 內容高 198.5mm，預留 3.5mm 給 Word 表格邊框外溢與行高誤差；列間距 1.6mm 另加約 1.1mm 邊框外溢
  const rowH = (195 - headH - titleH - subH - 2.4 - bannerH - footH - 2.7 * (n - 1)) / n;
  const labelH = .98 * 4 * 1.25;
  const convH = state.conv.mode === "inline" ? .85 * 4 * 1.45 + .4 : .5;
  const boxH = Math.min(12.5, Math.max(8, rowH - 2.8 - labelH - .4 - convH));   // 2.8 = 上下邊距 + 誤差
  const feeEm = Math.min(2.6, boxH / (4 * 1.2));                                   // 價格框變矮時字級同步縮小
  const planNeed = 3.15 * 4 * 1.1 + .6 + 2 * .94 * 4 * 1.25;
  const f = Math.min(1, (rowH - 2.2) / planNeed);              // 方案格文字縮放（列太矮時）
  const LH = (em, k) => T(em * 4 * k);                          // 固定行高（em × 倍率）

  let body = "";
  // 頁首：品牌紅框 + 金線
  body += wTbl([T(28), T(W - 28)], [{h: T(headH), cells: [
    wTc(wP(wRun("全國電子", {color: WHITE, sz: S(1.45)}), {align: "center", line: LH(1.45, 1.25)}), {w: T(28), shd: RED, vAlign: "center"}),
    wTc(wP("", {bdrB: {sz: B(.7), color: GOLD}, line: 20, sz: 2}), {w: T(W - 28), vAlign: "center", mar: {left: T(2.5)}})
  ]}]);
  // 標題／副標
  body += wP(wRun(c.name + "\n延長保固方案", {color: RED, sz: S(4.5)}), {before: T(1.6), line: T(4.5 * 4 * 1.2)});
  if(subLines) body += wP(wRun(subTxt, {color: INK, sz: S(subEm)}), {before: T(1.2), line: T(subEm * 4 * 1.3)});
  // 方案列
  body += wSpacer(T(2.4));
  c.plans.forEach((plan, i) => {
    if(i) body += wSpacer(T(1.6));
    const y = yrs(plan), fee = fees[plan];
    const feeTxt = (fee === "" || fee === undefined) ? "" : nf(Number(String(fee).replace(/[^\d.]/g, "")) || fee);
    const b = i % 2 === 1;
    const line = {sz: B(.55), color: b ? RED : GOLD}, mid = {sz: B(.4), color: b ? "EABFC0" : GOLDL};
    const planW = W * .34, feeW = W - planW;
    const ntW = 15, yuanW = 9, boxW = feeW - 3 - 2.4 - ntW - yuanW;
    const red = {sz: B(.7), color: RED};
    const planCell = wTc(
      wP(wRun(plan, {font: AB, color: RED, sz: S(3.15 * f)}), {line: LH(3.15 * f, 1.1)}) +
      wP(wRun("原廠" + y.base + "年\n＋延長" + y.ext + "年", {color: INK, sz: S(.94 * f)}), {before: T(.6), line: T(.94 * f * 4 * 1.25)}),
      {w: T(planW), shd: b ? PINK : CREAM, vAlign: "center", mar: {top: T(1), left: T(2), bottom: T(1.2), right: T(2)}});
    const feeTbl = wTbl([T(ntW), T(boxW), T(yuanW)], [{h: T(boxH), cells: [
      wTc(wP(wRun("NT$", {color: INK, sz: S(1.7)}), {line: LH(1.7, 1.2)}), {w: T(ntW), vAlign: "center"}),
      wTc(wP(wRun(feeTxt, {font: AB, color: RED, sz: S(feeEm)}), {align: "center", line: LH(feeEm, 1.2)}),
          {w: T(boxW), vAlign: "center", shd: WHITE, bdr: {top: red, left: red, bottom: red, right: red}}),
      wTc(wP(wRun("元", {color: INK, sz: S(1.7)}), {align: "right", line: LH(1.7, 1.25)}), {w: T(yuanW), vAlign: "center"})
    ]}]);
    const conv = state.conv.mode === "inline" ? convText(plan, fee) : "";
    const feeCell = wTc(
      wP(wRun("延保費用", {color: INK, sz: S(.98)}), {line: T(labelH), after: T(.4)}) + feeTbl +
      (conv ? wP(wRun(conv, {color: RED, sz: S(.85)}), {before: T(.4), line: LH(.85, 1.45), align: "right"}) : wSpacer(T(.5))),
      {w: T(feeW), shd: WHITE, vAlign: "center", mar: {top: T(1), left: T(3), bottom: T(1.2), right: T(2.4)}});
    body += wTbl([T(planW), T(feeW)], [{h: T(rowH), mb: T(1.2), cells: [planCell, feeCell]}],
      {bdr: {top: line, left: line, bottom: line, right: line, insideV: mid}});
  });
  // 紅底橫幅
  if(bannerOn){
    body += wSpacer(T(2));
    const plan = c.plans.includes(sl.plan) ? sl.plan : c.plans[0];
    const unit = state.conv.unit === "day" ? "day" : "month";
    const v = convValues(plan, fees[plan]);
    const shown = sl.manual !== "" ? sl.manual : (v ? v[unit] : "");
    const word = unit === "day" ? "每天" : "每月";
    const bw = [34.5, 12, W - 34.5 - 12 - 10.4, 10.4];
    body += wTbl(bw.map(T), [{h: T(13), cells: [
      wTc(wP(wRun(word, {color: WHITE, sz: S(1.8)}) + wRun("只要", {color: YEL, sz: S(1.8)}), {line: LH(1.8, 1.25)}),
          {w: T(bw[0]), shd: RED, vAlign: "center", mar: {left: T(2.5)}}),
      wTc(wP(wRun("NT$", {color: WHITE, sz: S(1.5)}), {align: "center", line: LH(1.5, 1.2)}), {w: T(bw[1]), shd: RED, vAlign: "center"}),
      wTc(wTbl([T(bw[2])], [{h: T(10.6), cells: [
            wTc(wP(wRun(shown, {font: AB, color: RED, sz: S(2.3)}), {align: "center", line: LH(2.3, 1.2)}), {w: T(bw[2]), shd: WHITE, vAlign: "center"})
          ]}]) + wSpacer(10),
          {w: T(bw[2]), shd: RED, vAlign: "top", mar: {top: T(1.2)}}),
      wTc(wP(wRun("元", {color: WHITE, sz: S(1.5)}), {line: LH(1.5, 1.25)}), {w: T(bw[3]), shd: RED, vAlign: "center", mar: {left: T(1.6)}})
    ]}]);
  }
  // 頁尾
  body += wSpacer(T(2.2));
  if(showDivider) body += wP("", {bdrB: {sz: B(.4), color: GOLD}, line: T(.8), after: T(1.8), sz: 2});
  if(showSlogan) body += wP(wRun("延長安心，使用更放心", {color: RED, sz: S(1.85)}), {align: "center", line: T(1.85 * 4 * 1.3), after: T(1.2)});
  body += wP(wRun(state.foot, {color: INK, sz: S(.84)}), {align: "center", line: T(.84 * 4 * 1.45)});
  return body;
}

/* 整頁：依目前版面把海報排進外層表格 */
function buildDocx(){
  const L = LAYOUTS[state.layout], s = L.scale;
  const T = mm => Math.round(mm * s * 56.6929);
  const order = sheetOrder();
  const pgW = L.page === "landscape" ? 16838 : 11906, pgH = L.page === "landscape" ? 11906 : 16838;
  const cellW = Math.round(L.cw * 56.6929);
  const cellH = Math.round(L.ch * 56.6929) - Math.ceil(60 / L.rows);   // 預留頁尾空段落，避免多出一頁
  const mark = state.marks ? {val: "dashed", sz: 2, color: "C9C9C9"} : null;
  const bdr = mark ? {top: mark, left: mark, bottom: mark, right: mark, insideH: mark, insideV: mark} : {};
  const rows = [], cols = [];
  for(let k = 0; k < L.cols; k++) cols.push(cellW);
  for(let r = 0; r < L.rows; r++){
    const cells = [];
    for(let k = 0; k < L.cols; k++){
      cells.push(wTc(posterDocx(order[r * L.cols + k], s),
        {w: cellW, shd: "FBFAF7", vAlign: "top", mar: {top: T(6.5), left: T(7), bottom: T(5), right: T(7)}}));
    }
    rows.push({h: cellH, mb: T(5), cells: cells});
  }
  const doc = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ' + W_NS + '><w:body>' +
    wTbl(cols, rows, {bdr: bdr}) +
    '<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="20" w:lineRule="exact"/><w:rPr><w:sz w:val="2"/></w:rPr></w:pPr></w:p>' +
    '<w:sectPr><w:pgSz w:w="' + pgW + '" w:h="' + pgH + '"' + (L.page === "landscape" ? ' w:orient="landscape"' : '') + '/>' +
    '<w:pgMar w:top="0" w:right="0" w:bottom="0" w:left="0" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr></w:body></w:document>';

  const X = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const contentTypes = X + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
    '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
    '<Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/></Types>';
  const rels = X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
  const docRels = X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
    '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/></Relationships>';
  const styles = X + '<w:styles ' + W_NS + '><w:docDefaults><w:rPrDefault><w:rPr>' +
    '<w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:eastAsia="Microsoft JhengHei" w:cs="Arial"/><w:sz w:val="22"/><w:szCs w:val="22"/>' +
    '<w:lang w:val="en-US" w:eastAsia="zh-TW"/></w:rPr></w:rPrDefault>' +
    '<w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>' +
    '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>' +
    '<w:style w:type="table" w:default="1" w:styleId="TableNormal"><w:name w:val="Normal Table"/><w:tblPr>' +
    '<w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="0" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="0" w:type="dxa"/></w:tblCellMar>' +
    '</w:tblPr></w:style></w:styles>';
  const settings = X + '<w:settings ' + W_NS + '><w:compat>' +
    '<w:compatSetting w:name="compatibilityMode" w:uri="http://schemas.microsoft.com/office/word" w:val="15"/></w:compat></w:settings>';

  const enc = new TextEncoder();
  return makeZip([
    {name: "[Content_Types].xml",          data: enc.encode(contentTypes)},
    {name: "_rels/.rels",                  data: enc.encode(rels)},
    {name: "word/_rels/document.xml.rels", data: enc.encode(docRels)},
    {name: "word/document.xml",            data: enc.encode(doc)},
    {name: "word/styles.xml",              data: enc.encode(styles)},
    {name: "word/settings.xml",            data: enc.encode(settings)}
  ]);
}

/* 最小 ZIP（stored，不壓縮）——.docx 只是 ZIP 容器 */
function crc32(u8){
  let crc = 0xFFFFFFFF;
  for(let i = 0; i < u8.length; i++){
    let c = (crc ^ u8[i]) & 0xFF;
    for(let k = 0; k < 8; k++) c = c & 1 ? (c >>> 1) ^ 0xEDB88320 : c >>> 1;
    crc = (crc >>> 8) ^ c;
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(files){
  const enc = new TextEncoder(), parts = [], cd = [];
  const d = new Date();
  const dosT = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosD = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let off = 0;
  files.forEach(f => {
    const name = enc.encode(f.name), data = f.data, crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosT, true); lh.setUint16(12, dosD, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosT, true); ch.setUint16(14, dosD, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
    ch.setUint16(28, name.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true);
    ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, off, true);
    cd.push(new Uint8Array(ch.buffer), name);
    off += 30 + name.length + data.length;
  });
  const cdSize = cd.reduce((s, a) => s + a.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(4, 0, true); e.setUint16(6, 0, true);
  e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, cdSize, true); e.setUint32(16, off, true); e.setUint16(20, 0, true);
  return new Blob(parts.concat(cd, [new Uint8Array(e.buffer)]),
    {type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}
const LAYOUT_FILE = {full: "A4", duo: "A4雙拼", quad: "A4四拼", octo: "A4八拼"};
function exportWord(){
  const L = LAYOUTS[state.layout];

}

function restore(){
  let o;
  try{ o = JSON.parse(localStorage.getItem(LSKEY) || "null"); }catch(err){ return; }
  if(!o || !Array.isArray(o.slots)) return;
  for(let i = 0; i < SLOTS; i++){
    const s = o.slots[i], t = state.slots[i];
    if(!s || typeof s !== "object") continue;
    if(typeof s.cid === "string") t.cid = s.cid;
    t.amount = (typeof s.amount === "string" || typeof s.amount === "number") ? String(s.amount) : "";
    if(s.fees && typeof s.fees === "object") t.fees = s.fees;
    if(typeof s.plan === "string") t.plan = s.plan;
    if(typeof s.manual === "string") t.manual = s.manual;
  }
  if(Number.isInteger(o.tab) && o.tab >= 0 && o.tab < SLOTS) state.tab = o.tab;
  if(o.conv && typeof o.conv === "object"){
    if(["none","banner","inline"].includes(o.conv.mode))  state.conv.mode  = o.conv.mode;
    if(["month","day","both"].includes(o.conv.unit))      state.conv.unit  = o.conv.unit;
    if(["ext","total"].includes(o.conv.basis))            state.conv.basis = o.conv.basis;
  }
  if(LAYOUTS[o.layout]) state.layout = o.layout;
  if(["same","tabs","cats"].includes(o.fill)) state.fill = o.fill;
  if(typeof o.marks  === "boolean") state.marks  = o.marks;
  if(typeof o.slogan === "boolean") state.slogan = o.slogan;
  if(typeof o.foot   === "string")  state.foot   = o.foot;
}

/* ---------- 啟動 ---------- */
restore();
initFees();
applyAmount(false); renderPanel(); renderSheet();
</script>
